<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grade Calculator</title>
  </head>
  <body>
    <label for="scoreInput">Score:</label>
    <input type="number" id="scoreInput" placeholder="Enter a score" />
    <button id="gradeBtn">Get Grade</button>
    <p id="gradeResult"></p>

    <script>
      function getGrade(score) {
        if (score >= 90) {
          return 'A';
        } else if (score >= 80) {
          return 'B';
        } else if (score >= 70) {
          return 'C';
        } else if (score >= 60) {
          return 'D';
        } else {
          return 'F';
        }
      }

      const scoreInput = document.getElementById('scoreInput');
      const gradeBtn = document.getElementById('gradeBtn');
      const gradeResult = document.getElementById('gradeResult');

      gradeBtn.addEventListener('click', () => {
        const scoreValue = scoreInput.value.trim();

        if (scoreValue === '') {
          gradeResult.textContent = 'Please enter a score';
          gradeResult.style.color = 'black';
          return;
        }

        const score = Number(scoreValue);
        if (Number.isNaN(score) || score < 0 || score > 100) {
          gradeResult.textContent = 'Score must be 0-100';
          gradeResult.style.color = 'black';
          return;
        }

        const grade = getGrade(score);
        gradeResult.textContent = grade;
        if (grade === 'A' || grade === 'B') {
          gradeResult.style.color = 'green';
        } else if (grade === 'D' || grade === 'F') {
          gradeResult.style.color = 'red';
        } else {
          gradeResult.style.color = 'orange';
        }
      });
    </script>
  </body>
</html>
