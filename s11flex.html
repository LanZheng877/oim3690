<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flexbox Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Flexbox demo — interactive</h1>

  <div class="controls">
    <label>Direction
      <select id="direction">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>
    </label>

    <label>Justify
      <select id="justify">
        <option value="flex-start">flex-start</option>
        <option value="center">center</option>
        <option value="flex-end">flex-end</option>
        <option value="space-between">space-between</option>
        <option value="space-around">space-around</option>
        <option value="space-evenly">space-evenly</option>
      </select>
    </label>

    <label>Align
      <select id="align">
        <option value="stretch">stretch</option>
        <option value="flex-start">flex-start</option>
        <option value="center">center</option>
        <option value="flex-end">flex-end</option>
        <option value="baseline">baseline</option>
      </select>
    </label>

    <label>Wrap
      <select id="wrap">
        <option value="nowrap">nowrap</option>
        <option value="wrap">wrap</option>
        <option value="wrap-reverse">wrap-reverse</option>
      </select>
    </label>

    <label>Gap <input id="gap" type="range" min="0" max="40" value="12"> <span id="gapVal">12px</span></label>
  </div>

  <section class="demo" id="container">
    <div class="item">1<br><small>one</small></div>
    <div class="item">2<br><small>two</small></div>
    <div class="item">3<br><small>three</small></div>
    <div class="item">4<br><small>four</small></div>
    <div class="item">5<br><small>five</small></div>
    <div class="item">6<br><small>six</small></div>
  </section>

  <h2>Generated CSS</h2>
  <pre id="cssCode"></pre>

  <script src="script.js"></script>
</body>
</html>
