<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greeting Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7ff 0%, #d8e4ff 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2a44;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
      padding: 28px;
      width: min(420px, 92vw);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.8rem;
      color: #2a3f6f;
    }

    p {
      font-size: 1.05rem;
      margin: 14px 0 18px;
      color: #3a4a6f;
    }

    input,
    select,
    button {
      width: 100%;
      font-size: 1rem;
      margin: 7px 0;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #becbf0;
      outline: none;
      box-sizing: border-box;
    }

    input:focus,
    select:focus,
    button:focus {
      border-color: #4f7eff;
      box-shadow: 0 0 0 3px rgba(79, 126, 255, 0.2);
    }

    button {
      background: #4f7eff;
      color: white;
      border: 1px solid #436ae5;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .footer {
      margin-top: 10px;
      font-size: 0.92rem;
      color: #6f7fa3;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Personalized Greeting</h1>

    <label for="nameInput">Enter your name:</label>
    <input id="nameInput" type="text" placeholder="Type your name" />

    <label for="languageSelect">Choose a language:</label>
    <select id="languageSelect">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="ja">Japanese</option>
    </select>

    <button id="greetButton">Show Greeting</button>

    <p id="greetingText">Your greeting appears here.</p>

    <p class="footer">Click the button to generate your greeting.</p>
  </section>

  <script>
    const button = document.querySelector('#greetButton');
    const output = document.querySelector('#greetingText');
    const nameInput = document.querySelector('#nameInput');
    const languageSelect = document.querySelector('#languageSelect');

    function getGreeting(lang) {
      switch (lang) {
        case 'es':
          return '¡Hola';
        case 'fr':
          return 'Bonjour';
        case 'de':
          return 'Hallo';
        case 'it':
          return 'Ciao';
        case 'ja':
          return 'こんにちは';
        default:
          return 'Hello';
      }
    }

    button.addEventListener('click', () => {
      let name = nameInput.value.trim();
      if (!name) {
        name = 'friend';
      }

      const greetingStart = getGreeting(languageSelect.value);
      output.textContent = `${greetingStart}, ${name}!`;
    });

    languageSelect.addEventListener('change', () => {
      // update immediately when language changes and name exists
      let name = nameInput.value.trim();
      if (!name) {
        name = 'friend';
      }
      const greetingStart = getGreeting(languageSelect.value);
      output.textContent = `${greetingStart}, ${name}!`;
    });
  </script>
</body>
</html>
